# Same routes as the Vite dev proxy (vite.config.js), pointed at the backend container.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    location ~ ^/(auth|me|users|barns|devices|registrations|alerts|audit-logs|scheduled-events|health|firmware-jobs)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Server-sent events and the MJPEG camera feed: stream without buffering.
    location ~ ^/(events|camera)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API & Video Stream to Backend
    location /camera/ {
        proxy_pass http://backend:8000/camera/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
    }

    location /devices {
        proxy_pass http://backend:8000/devices;
        proxy_set_header Host $host;
    }

    location /devices/ {
        proxy_pass http://backend:8000/devices/;
        proxy_set_header Host $host;
    }

    location /registrations {
        proxy_pass http://backend:8000/registrations;
        proxy_set_header Host $host;
    }

    location /registrations/ {
        proxy_pass http://backend:8000/registrations/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location /auth/ {
        proxy_pass http://backend:8000/auth/;
        proxy_set_header Host $host;
    }

    location /alerts {
        proxy_pass http://backend:8000/alerts;
        proxy_set_header Host $host;
    }

    location /alerts/ {
        proxy_pass http://backend:8000/alerts/;
        proxy_set_header Host $host;
    }

    location /events {
        proxy_pass http://backend:8000/events;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }
}

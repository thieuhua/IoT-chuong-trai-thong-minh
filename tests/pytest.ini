[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
cache_dir = .pytest_cache
markers =
    broker_that: cần Mosquitto thật (deployment/compose.yaml), tự bỏ qua khi không có
    hieu_nang: đo hiệu năng, ghi số liệu vào tests/ket-qua/
filterwarnings =
    ignore::DeprecationWarning

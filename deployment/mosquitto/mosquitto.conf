# Development broker with per-device accounts (Dynamic Security).
# No TLS: use only on a trusted LAN. See docs/protocol.md section 8.
listener 1883 0.0.0.0
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Keep retained status/meta across broker restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

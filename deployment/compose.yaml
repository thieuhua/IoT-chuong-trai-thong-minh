name: iot-platform

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    entrypoint: ["/bin/sh", "/mosquitto/entrypoint.sh"]
    env_file: .env
    # All host interfaces: needed for ESP32 on the LAN. Development only.
    ports:
      - "1883:1883"
    volumes:
      - type: bind
        source: ./mosquitto/mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
      - type: bind
        source: ./mosquitto/entrypoint.sh
        target: /mosquitto/entrypoint.sh
        read_only: true
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/dynsec-ready && mosquitto_sub -h 127.0.0.1 -u backend -P \"$$MQTT_BACKEND_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  mosquitto-data:
